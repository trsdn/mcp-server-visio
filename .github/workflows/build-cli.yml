name: Build CLI

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/VisioMcp.CLI/**'
      - 'src/VisioMcp.Core/**'
      - 'src/VisioMcp.ComInterop/**'
      - 'tests/VisioMcp.CLI.Tests/**'
      - 'tests/VisioMcp.Core.Tests/**'
      - 'tests/VisioMcp.ComInterop.Tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/build-cli.yml'
  pull_request:
    branches: [ main ]
  # Manual trigger. Also the mechanism by which a dormant workflow can be registered with, and
  # verified against, GitHub Actions - see #12.
  workflow_dispatch:

jobs:
  build-cli:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore VisioMcp.sln

    - name: Build solution
      # The coverage audit reads generated output from BOTH VisioMcp.Core (dispatch, CLI
      # categories) and VisioMcp.McpServer (MCP tools), so the whole solution must be built.
      # Building only the CLI project leaves McpTool.*.g.cs absent and the audit fails.
      run: dotnet build VisioMcp.sln --no-restore --configuration Release

    - name: Verify Core Commands Coverage
      run: |
        Write-Output "Verifying Core Commands coverage..."
        & scripts/audit-core-coverage.ps1 -FailOnGaps
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Coverage gaps detected."
          exit 1
        }
        Write-Output "Coverage audit passed"
      shell: pwsh

    - name: Verify CLI build
      run: |
        # Check visiocli main executable
        if (Test-Path "src/VisioMcp.CLI/bin/Release/net9.0-windows/visiocli.exe") {
          Write-Output "✅ visiocli.exe built successfully"
          $version = (Get-Item "src/VisioMcp.CLI/bin/Release/net9.0-windows/visiocli.exe").VersionInfo.FileVersion
          Write-Output "Version: $version"

          # Test CLI help command (safe - no Visio COM required)
          $helpOutput = & "src/VisioMcp.CLI/bin/Release/net9.0-windows/visiocli.exe" --help 2>&1
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            Write-Output "✅ CLI help command working (exit code: 0)"
            Write-Output "📋 Help output preview:"
            $helpOutput | Select-Object -First 5 | ForEach-Object { Write-Output "  $_" }
          } else {
            Write-Error "❌ CLI help command failed with exit code: $exitCode"
            Write-Output "Full output:"
            $helpOutput | ForEach-Object { Write-Output "  $_" }
            exit 1
          }
        } else {
          Write-Error "❌ visiocli.exe not found"
          exit 1
        }

        Write-Output "🔧 CLI tool ready for direct automation"
      shell: pwsh

    - name: Upload CLI build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VisioMcp-CLI-${{ github.sha }}
        path: src/VisioMcp.CLI/bin/Release/net9.0-windows/

  unit-tests:
    # The non-integration suite needs no Visio and no self-hosted runner, so it can gate every PR.
    # Before #14 no registered workflow ran dotnet test at all: the only real invocation lived in
    # integration-tests.yml, which was unregistered AND gated off by default, so a green check was
    # reported having executed zero tests.
    name: Unit tests
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore VisioMcp.sln

    - name: Build solution
      run: dotnet build VisioMcp.sln --no-restore --configuration Debug

    - name: Run non-integration tests
      # No LogFileName: each test project generates its own uniquely-named .trx. Pinning one name
      # makes every project overwrite the previous one, leaving results for only the last.
      run: |
        dotnet test VisioMcp.sln --no-build --configuration Debug `
          --filter "Category!=Integration" `
          --logger "trx" `
          --results-directory TestResults
      shell: pwsh

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results-${{ github.sha }}
        path: TestResults/

  quality-gates:
    # Runs the pre-commit gates that do NOT require Visio, so they cannot silently rot again.
    # Test-CliWorkflow.ps1 and the MCP smoke test need a real Visio instance and therefore stay
    # on the self-hosted integration runner; everything below is static or build-only.
    name: Quality gates
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore VisioMcp.sln

    - name: Build solution
      run: dotnet build VisioMcp.sln --no-restore --configuration Release

    - name: COM leak check
      run: |
        & scripts/check-com-leaks.ps1
        if ($LASTEXITCODE -ne 0) { exit 1 }
      shell: pwsh

    - name: Core Commands coverage audit
      run: |
        & scripts/audit-core-coverage.ps1 -FailOnGaps
        if ($LASTEXITCODE -ne 0) { exit 1 }
      shell: pwsh

    - name: Success flag check (Rule 0)
      run: |
        & scripts/check-success-flag.ps1
        if ($LASTEXITCODE -ne 0) { exit 1 }
      shell: pwsh

    - name: CLI Settings usage check
      run: |
        & scripts/check-cli-settings-usage.ps1
        if ($LASTEXITCODE -ne 0) { exit 1 }
      shell: pwsh
