# Dependency Review Workflow
# Scans pull requests for vulnerable dependencies before merging

name: 'Dependency Review'

on: 
  pull_request:
    branches: [ "main", "develop" ]
  # Manual trigger. Also the mechanism by which a dormant workflow can be registered with, and
  # verified against, GitHub Actions - see #12.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the build if vulnerabilities are found
          fail-on-severity: moderate
          
          # Fail if GPL/AGPL/LGPL licenses detected (stricter than MIT)
          license-check: true
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, LicenseRef-scancode-generic-cla, BlueOak-1.0.0, CC0-1.0
          
          # Comment on PR with summary
          comment-summary-in-pr: always
          
          # Show vulnerabilities by severity
          warn-only: false
          
          # Block critical and high severity vulnerabilities
          fail-on-scopes: runtime, development
          
          # Additional configuration
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

          # Known unfixable transitive vulnerabilities in dev-only build tools
          # minimatch@3.x ReDoS in @vscode/vsce (no fix available upstream)
          allow-ghsas: GHSA-3ppc-4f35-3m26

          # @github/copilot declares LicenseRef-bad-see-license-in-license.md, which is a scancode
          # classification artifact - it means the terms could not be parsed because the package
          # points at its own LICENSE.md instead of declaring an SPDX identifier - not an
          # incompatible licence. Without this, the licence check blocks the SECURITY fix for
          # GHSA advisories against @github/copilot (#141), which is the opposite of what this
          # workflow is for.
          #
          # Scoped to these packages deliberately. Adding the LicenseRef to allow-licenses would
          # permit ANY dependency whose licence cannot be classified, which is a far larger hole
          # than the problem justifies.
          #
          # These are development tooling: eval/ and src/VisioMcp.Agent are not published. release.yml
          # ships only the two skill npm packages, the NuGet tools, the VSIX and the MCPB bundle.
          allow-dependencies-licenses: >-
            pkg:npm/%40github/copilot,
            pkg:npm/%40github/copilot-darwin-arm64,
            pkg:npm/%40github/copilot-darwin-x64,
            pkg:npm/%40github/copilot-linux-arm64,
            pkg:npm/%40github/copilot-linux-x64,
            pkg:npm/%40github/copilot-linuxmusl-arm64,
            pkg:npm/%40github/copilot-linuxmusl-x64,
            pkg:npm/%40github/copilot-win32-arm64,
            pkg:npm/%40github/copilot-win32-x64
          
      - name: Dependency Review Summary
        if: always()
        run: |
          echo "✅ Dependency review completed"
          echo "Review results are available in the Security tab"
